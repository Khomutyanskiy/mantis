# Конфигурация Mantis. Координаты задаются в долях кадра (0..1),
# чтобы конфиг не зависел от разрешения. Разметить можно утилитой:
#   python tools/calibrate.py --source video.mp4 --out config.yaml

model:
  weights: yolo11n-pose.pt     # pose-модель: даёт рамку человека + 17 ключевых точек (нос, глаза, уши)
  conf: 0.35                   # порог уверенности детекции
  imgsz: 1280                  # размер входа сети; больше = лучше видны мелкие/дальние люди, но медленнее
  device: null                 # null = авто; "cpu", "mps" (Mac M1+), "0" (NVIDIA GPU)
  tracker: bytetrack.yaml      # или botsort.yaml

source:
  rotate: auto                 # поворот кадра: auto — по метаданным (видео с телефона), или 0 / 90 / 180 / 270
  max_side: 1920               # кадры больше (4K) уменьшаются до этого по длинной стороне; 0 — не уменьшать

# Линия подсчёта: человек засчитывается как «прошёл», когда точка его ног пересекает линию.
count_line:
  - [0.50, 0.05]
  - [0.50, 0.95]

# Зона перед витриной (многоугольник). Торможение и взгляд считаются только внутри неё.
showcase_zone:
  - [0.05, 0.05]
  - [0.95, 0.05]
  - [0.95, 0.95]
  - [0.05, 0.95]

slowdown:
  # Скорость меряется в «ростах человека в секунду» (высота рамки), это нивелирует перспективу.
  # Обычная ходьба ~0.7–1.0 роста/с.
  speed_threshold: 0.30        # ниже этого — человек «тормозит»
  min_slow_seconds: 1.0        # столько секунд суммарно медленно в зоне => «притормозил»
  dwell_seconds: 8.0           # или столько секунд в зоне в целом => тоже «притормозил»
  dwell_only_with_zone: true   # правило «долго в зоне» — только если зона нарисована (не весь кадр)
  smoothing_seconds: 0.5       # окно сглаживания скорости
  focal_ratio: 0.8             # фокусное в долях длинной стороны кадра — для учёта движения к камере
  depth_window_seconds: 1.0    # окно для оценки скорости по глубине (изменение высоты рамки)

look:
  # Где витрина относительно камеры:
  #   camera — камера стоит в витрине и смотрит на прохожих (рекомендуется, самый точный режим)
  #   left / right — витрина слева/справа в кадре (камера сбоку/сверху; менее точно)
  showcase_direction: camera
  max_yaw: 0.35                # режим camera: |поворот головы| меньше => смотрит в камеру/витрину
  min_side_yaw: 0.35           # режимы left/right: голова повёрнута в сторону витрины сильнее этого
  min_look_seconds: 0.6        # суммарно столько секунд взгляда в зоне => «посмотрел»
  min_keypoint_conf: 0.5

tracking:
  lost_timeout_seconds: 2.0    # трек считается завершённым, если человека нет столько секунд
  min_track_seconds: 0.5       # короче — считаем шумом, в статистику не идёт

output:
  dir: output
  save_video: true             # сохранять размеченное видео (лица не вырезаются и не сохраняются отдельно)
  show: false                  # показывать окно в реальном времени
  display_height: 900          # окно ужимается до этих размеров (вертикальное видео с телефона)
  display_width: 1600
  fullscreen: false            # во весь экран сразу (в окне клавиша f переключает)
  summary_every_seconds: 10    # live-режим: как часто обновлять summary.json и печатать сводку
